services:
  db:
    image: postgres:16-alpine
    container_name: transacciones_db
    environment:
      POSTGRES_DB: transacciones
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d transacciones"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: transacciones_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://demo:demo123@db:5432/transacciones
      SECRET_KEY: cambia-esta-clave-en-produccion
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      SESSION_TIMEOUT_MINUTES: 30
      CORS_ORIGINS: "*"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks: [appnet]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://api.htqasas.com
        VITE_WS_URL: wss://api.htqasas.com/ws
    container_name: transacciones_frontend
    depends_on: [backend]
    ports:
      - "8080:80"
      - "5173:80"
    networks: [appnet]

volumes:
  pgdata:

networks:
  appnet:
    driver: bridge
