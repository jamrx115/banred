name: Submit Main Cloud Build

on:
  workflow_dispatch:

concurrency:
  group: submit-main-cloud-build
  cancel-in-progress: false

env:
  PROJECT_ID: banred
  REGION: us-central1
  NAME_PREFIX: banred-main
  DOMAIN_NAME: banred.htqasas.com

jobs:
  submit:
    name: Submit Cloud Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit build to Cloud Build
        run: |
          gcloud builds submit . \
            --project="${PROJECT_ID}" \
            --config=cloudbuild.main.yaml \
            --substitutions="_REGION=${REGION},_NAME_PREFIX=${NAME_PREFIX},_DOMAIN_NAME=${DOMAIN_NAME}"
